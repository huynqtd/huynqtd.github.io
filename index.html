<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý nhân sự & doanh nghiệp</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo } = React;
    const h = React.createElement;

    // ====== CẤU HÌNH SHEET ======
    const SHEET_ID = "1wH_rQwpF2jRO_8s277hq_kmuN-i79JMzKqNx43XAK0Y";
    const GID_NHANSU = "557275852";
    const GID_DOANHNGHIEP = "869158415";

    const csvUrl = (gid) =>
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

    // ====== TIỆN ÍCH ======
    const formatDate = (iso) => {
      if (!iso) return "—";
      if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
        const [y, m, d] = iso.split("-");
        return `${d}/${m}/${y}`;
      }
      return iso;
    };

    const normalizeMST = (s) => (s || "").replace(/[\s\-\.]/g, "").trim();

    // Lấy giá trị theo nhiều biến thể tên cột (dấu sắc/huyền, khoảng trắng)
    const getVal = (obj, ...keys) => {
      for (const k of keys) {
        if (obj[k] !== undefined && obj[k] !== "") return obj[k];
      }
      return "";
    };

    function useSheetData(gid, { filterEmpty }) {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        let cancelled = false;
        fetch(csvUrl(gid))
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status} – không tải được sheet (gid=${gid})`);
            return res.text();
          })
          .then((csv) => {
            if (cancelled) return;
            if (csv.trim().startsWith("<")) {
              throw new Error("Sheet chưa public. Share → Anyone with the link → Viewer.");
            }
            const { data: rows } = Papa.parse(csv, { header: true, skipEmptyLines: true });
            const cleaned = rows
              .map((r) => {
                const o = {};
                Object.keys(r).forEach((k) => {
                  o[k.trim()] = (r[k] ?? "").toString().trim();
                });
                return o;
              })
              .filter(filterEmpty);
            if (cleaned.length === 0) {
              throw new Error("Không có dòng dữ liệu. Kiểm tra tên cột hoặc gid.");
            }
            setData(cleaned);
          })
          .catch((e) => !cancelled && setError(e))
          .finally(() => !cancelled && setLoading(false));
        return () => { cancelled = true; };
      }, [gid]);

      return { data, loading, error };
    }

    const useNhanSuData = () =>
      useSheetData(GID_NHANSU, { filterEmpty: (r) => r.id || r.hoTen });

    const useDoanhNghiepData = () =>
      useSheetData(GID_DOANHNGHIEP, {
        filterEmpty: (r) => r["Tên NNT"] || r["Mã số thuế"] || r["Mã cán bộ"],
      });

    // ====== COMPONENT DÙNG CHUNG ======
    function Loading() {
      return h("div", { className: "min-h-screen flex items-center justify-center text-gray-500" },
        "Đang tải dữ liệu từ Google Sheet..."
      );
    }

    function ErrorBox({ error }) {
      return h("div", { className: "min-h-screen flex items-center justify-center p-4" },
        h("div", { className: "bg-red-50 border border-red-200 text-red-700 rounded-lg p-6 max-w-lg" },
          h("p", { className: "font-semibold mb-1" }, "Không tải được dữ liệu"),
          h("p", { className: "text-sm" }, error.message)
        )
      );
    }

    // ====== MODAL: CHI TIẾT CÁN BỘ ======
    function CanBoDetail({ tenCanBo, data, onClose }) {
      const dsQuanLy = useMemo(
        () =>
          data.filter(
            (d) =>
              (d["Tên cán bộ quản lý"] || "").trim().toLowerCase() ===
              (tenCanBo || "").trim().toLowerCase()
          ),
        [data, tenCanBo]
      );

      return h("div", {
        className: "fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50",
        onClick: onClose,
      },
        h("div", {
          className: "bg-white rounded-xl shadow-xl w-full max-w-4xl max-h-[85vh] overflow-hidden flex flex-col",
          onClick: (e) => e.stopPropagation(),
        },
          // Header
          h("div", { className: "flex items-center justify-between px-5 py-4 border-b border-gray-200" },
            h("div", null,
              h("h2", { className: "text-lg font-semibold text-gray-800" },
                "Cán bộ: ", h("span", { className: "text-blue-700" }, tenCanBo || "—")
              ),
              h("p", { className: "text-sm text-gray-500" },
                `Quản lý ${dsQuanLy.length} doanh nghiệp`
              )
            ),
            h("button", {
              onClick: onClose,
              className: "text-gray-400 hover:text-gray-700 text-2xl leading-none px-2",
            }, "×")
          ),

          // Body
          h("div", { className: "overflow-auto p-5" },
            dsQuanLy.length === 0
              ? h("p", { className: "text-center text-gray-500 py-8" },
                  "Cán bộ này chưa được phân công quản lý doanh nghiệp nào."
                )
              : h("table", { className: "w-full text-sm" },
                  h("thead", { className: "bg-gray-50 text-gray-600 uppercase text-xs sticky top-0" },
                    h("tr", null,
                      ["Mã số thuế", "Tên NNT", "Phòng", "CQT quản lý"].map((x) =>
                        h("th", { key: x, className: "px-3 py-2 text-left whitespace-nowrap" }, x)
                      )
                    )
                  ),
                  h("tbody", { className: "divide-y divide-gray-100" },
                    dsQuanLy.map((d, i) =>
                      h("tr", { key: i, className: "hover:bg-gray-50" },
                        h("td", { className: "px-3 py-2 font-medium text-gray-800 whitespace-nowrap" }, d["Mã số thuế"] || "—"),
                        h("td", { className: "px-3 py-2 text-gray-800" }, d["Tên NNT"] || "—"),
                        h("td", { className: "px-3 py-2 text-gray-700" }, d["Tên phòng"] || "—"),
                        h("td", { className: "px-3 py-2 text-gray-700 whitespace-nowrap" }, d["CQT quản lý"] || "—")
                      )
                    )
                  )
                )
          )
        )
      );
    }

    // ====== NHÂN SỰ ======
    function NhanSuCard({ n }) {
      return h("div", { className: "bg-white rounded-xl shadow-sm hover:shadow-md transition p-4 flex gap-4" },
        h("img", {
          src: n.avatar || "https://via.placeholder.com/80",
          alt: n.hoTen,
          className: "w-20 h-20 rounded-full object-cover border-2 border-blue-100 shrink-0",
          onError: (e) => { e.currentTarget.src = "https://via.placeholder.com/80"; },
        }),
        h("div", { className: "flex-1 min-w-0" },
          h("h3", { className: "font-semibold text-gray-800 truncate" }, n.hoTen || "—"),
          h("p", { className: "text-sm text-blue-600 font-medium" }, n.chucVu || "—"),
          h("p", { className: "text-xs text-gray-500 mt-1" }, n.donVi || "—"),
          h("p", { className: "text-xs text-gray-500" }, n.toNghiepVu || "—"),
          h("div", { className: "mt-2 text-xs text-gray-600 space-y-0.5" },
            h("p", null, "📞 " + (n.soDienThoai || "—")),
            h("p", null, "☎️ " + (n.phone_cq || "—")),
            h("p", null, "🎂 " + formatDate(n.ngaySinh))
          )
        )
      );
    }

    function NhanSuTable({ data, onCanBoClick }) {
      return h("div", { className: "bg-white rounded-xl shadow-sm overflow-x-auto" },
        h("table", { className: "w-full text-sm" },
          h("thead", { className: "bg-gray-50 text-gray-600 uppercase text-xs" },
            h("tr", null,
              ["Nhân sự", "Chức vụ", "Đơn vị", "Tổ nghiệp vụ", "SĐT", "SĐT CQ", "Ngày sinh"].map((x) =>
                h("th", { key: x, className: "px-4 py-3 text-left" }, x))
            )
          ),
          h("tbody", { className: "divide-y divide-gray-100" },
            data.map((n) =>
              h("tr", { key: n.id || n.hoTen, className: "hover:bg-gray-50" },
                h("td", { className: "px-4 py-3" },
                  h("div", { className: "flex items-center gap-3" },
                    h("img", {
                      src: n.avatar || "https://via.placeholder.com/40",
                      alt: n.hoTen,
                      className: "w-9 h-9 rounded-full object-cover",
                      onError: (e) => { e.currentTarget.src = "https://via.placeholder.com/40"; },
                    }),
                    onCanBoClick
                      ? h("button", {
                          onClick: () => onCanBoClick(n.hoTen),
                          className: "font-medium text-blue-600 hover:underline whitespace-nowrap",
                          title: "Xem doanh nghiệp được quản lý",
                        }, n.hoTen || "—")
                      : h("span", { className: "font-medium text-gray-800 whitespace-nowrap" }, n.hoTen || "—")
                  )
                ),
                h("td", { className: "px-4 py-3 text-gray-700" }, n.chucVu || "—"),
                h("td", { className: "px-4 py-3 text-gray-700" }, n.donVi || "—"),
                h("td", { className: "px-4 py-3 text-gray-700" }, n.toNghiepVu || "—"),
                h("td", { className: "px-4 py-3 text-gray-700 whitespace-nowrap" }, n.soDienThoai || "—"),
                h("td", { className: "px-4 py-3 text-gray-700 whitespace-nowrap" }, n.phone_cq || "—"),
                h("td", { className: "px-4 py-3 text-gray-700 whitespace-nowrap" }, formatDate(n.ngaySinh))
              )
            )
          )
        )
      );
    }

    function NhanSuView() {
      const { data, loading, error } = useNhanSuData();
      const dnData = useDoanhNghiepData(); // để click cán bộ xem DN quản lý
      const [keyword, setKeyword] = useState("");
      const [donViFilter, setDonViFilter] = useState("");
      const [viewMode, setViewMode] = useState("card");
      const [selectedCanBo, setSelectedCanBo] = useState(null);

      const danhSachDonVi = useMemo(
        () => [...new Set(data.map((n) => n.donVi).filter(Boolean))],
        [data]
      );

      const filtered = useMemo(() => {
        const kw = keyword.toLowerCase();
        return data.filter((n) => {
          const matchKeyword =
            (n.hoTen || "").toLowerCase().includes(kw) ||
            (n.chucVu || "").toLowerCase().includes(kw) ||
            (n.soDienThoai || "").includes(keyword);
          const matchDonVi = donViFilter ? n.donVi === donViFilter : true;
          return matchKeyword && matchDonVi;
        });
      }, [data, keyword, donViFilter]);

      if (loading) return h(Loading);
      if (error) return h(ErrorBox, { error });

      return h("div", { className: "max-w-6xl mx-auto" },
        h("p", { className: "text-sm text-gray-500 mb-4" }, `Tổng: ${filtered.length} / ${data.length} nhân sự`),
        h("div", { className: "flex flex-col md:flex-row gap-3 mb-6" },
          h("input", {
            type: "text",
            placeholder: "Tìm theo tên, chức vụ, SĐT...",
            value: keyword,
            onChange: (e) => setKeyword(e.target.value),
            className: "flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400",
          }),
          h("select", {
            value: donViFilter,
            onChange: (e) => setDonViFilter(e.target.value),
            className: "px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-400",
          },
            h("option", { value: "" }, "Tất cả đơn vị"),
            danhSachDonVi.map((dv) => h("option", { key: dv, value: dv }, dv))
          ),
          h("div", { className: "flex rounded-lg overflow-hidden border border-gray-300" },
            h("button", {
              onClick: () => setViewMode("card"),
              className: `px-4 py-2 text-sm ${viewMode === "card" ? "bg-blue-600 text-white" : "bg-white text-gray-700"}`,
            }, "Thẻ"),
            h("button", {
              onClick: () => setViewMode("table"),
              className: `px-4 py-2 text-sm ${viewMode === "table" ? "bg-blue-600 text-white" : "bg-white text-gray-700"}`,
            }, "Bảng")
          )
        ),
        filtered.length === 0
          ? h("div", { className: "text-center text-gray-500 py-12" }, "Không tìm thấy nhân sự phù hợp.")
          : viewMode === "card"
            ? h("div", { className: "grid gap-4 sm:grid-cols-2 lg:grid-cols-3" },
                filtered.map((n) => h(NhanSuCard, { key: n.id || n.hoTen, n }))
              )
            : h(NhanSuTable, { data: filtered, onCanBoClick: setSelectedCanBo }),

        selectedCanBo
          ? h(CanBoDetail, {
              tenCanBo: selectedCanBo,
              data: dnData.data,
              onClose: () => setSelectedCanBo(null),
            })
          : null
      );
    }

    // ====== TRA CỨU MST ======
    function TraCuuMST({ data }) {
      const [mst, setMst] = useState("");

      const ketQua = useMemo(() => {
        const key = normalizeMST(mst);
        if (!key) return null;
        return data.filter((d) => normalizeMST(d["Mã số thuế"]).includes(key));
      }, [mst, data]);

      return h("div", { className: "bg-white rounded-xl shadow-sm p-5 mb-6" },
        h("h2", { className: "text-lg font-semibold text-gray-800 mb-1" }, "🔍 Tra cứu cán bộ quản lý theo MST"),
        h("p", { className: "text-xs text-gray-500 mb-3" }, "Nhập mã số thuế (có thể nhập một phần) để tìm cán bộ quản lý tương ứng."),
        h("input", {
          type: "text",
          placeholder: "Nhập mã số thuế, ví dụ: 0101234567",
          value: mst,
          onChange: (e) => setMst(e.target.value),
          className: "w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400",
        }),

        ketQua === null
          ? null
          : ketQua.length === 0
            ? h("div", { className: "mt-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3" },
                `Không tìm thấy doanh nghiệp có MST chứa "${mst}".`
              )
            : h("div", { className: "mt-4 space-y-3" },
                ketQua.map((d, i) =>
                  h("div", { key: i, className: "border border-blue-100 bg-blue-50 rounded-lg p-4" },
                    h("p", { className: "text-sm text-gray-600" },
                      "MST: ", h("span", { className: "font-semibold text-gray-800" }, d["Mã số thuế"] || "—")
                    ),
                    h("p", { className: "text-base font-semibold text-blue-700 mt-1" },
                      d["Tên NNT"] || "—"
                    ),
                    h("div", { className: "mt-2 grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm text-gray-700" },
                      h("p", null, "👤 Cán bộ quản lý: ", h("span", { className: "font-medium" }, d["Tên cán bộ quản lý"] || "—")),
                      h("p", null, "🆔 Mã cán bộ: ", h("span", { className: "font-medium" }, d["Mã cán bộ"] || "—")),
                      h("p", null, "🏢 Phòng: ", h("span", { className: "font-medium" }, d["Tên phòng"] || "—")),
                      h("p", null, "🏛️ CQT quản lý: ", h("span", { className: "font-medium" }, d["CQT quản lý"] || "—"))
                    )
                  )
                )
              )
      );
    }

    // ====== DOANH NGHIỆP ======
    function DoanhNghiepView() {
      const { data, loading, error } = useDoanhNghiepData();
      const [keyword, setKeyword] = useState("");
      const [cqtFilter, setCqtFilter] = useState("");
      const [canBoFilter, setCanBoFilter] = useState("");
      const [selectedCanBo, setSelectedCanBo] = useState(null);

      const danhSachCQT = useMemo(
        () => [...new Set(data.map((d) => d["CQT quản lý"]).filter(Boolean))].sort(),
        [data]
      );
      const danhSachCanBo = useMemo(
        () => [...new Set(data.map((d) => d["Tên cán bộ quản lý"]).filter(Boolean))].sort(),
        [data]
      );

      const filtered = useMemo(() => {
        const kw = keyword.toLowerCase();
        return data.filter((d) => {
          const matchKeyword =
            (d["Tên NNT"] || "").toLowerCase().includes(kw) ||
            (d["Mã số thuế"] || "").toLowerCase().includes(kw) ||
            (d["Mã cán bộ"] || "").toLowerCase().includes(kw) ||
            (d["Tên cán bộ quản lý"] || "").toLowerCase().includes(kw) ||
            (d["Tên phòng"] || "").toLowerCase().includes(kw);
          const matchCQT = cqtFilter ? d["CQT quản lý"] === cqtFilter : true;
          const matchCanBo = canBoFilter ? d["Tên cán bộ quản lý"] === canBoFilter : true;
          return matchKeyword && matchCQT && matchCanBo;
        });
      }, [data, keyword, cqtFilter, canBoFilter]);

      if (loading) return h(Loading);
      if (error) return h(ErrorBox, { error });

      return h("div", { className: "max-w-7xl mx-auto" },
        h(TraCuuMST, { data }),

        h("p", { className: "text-sm text-gray-500 mb-4" }, `Tổng: ${filtered.length} / ${data.length} doanh nghiệp`),

        h("div", { className: "flex flex-col md:flex-row gap-3 mb-6" },
          h("input", {
            type: "text",
            placeholder: "Tìm theo tên NNT, mã số thuế, mã/tên cán bộ, phòng...",
            value: keyword,
            onChange: (e) => setKeyword(e.target.value),
            className: "flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400",
          }),
          h("select", {
            value: cqtFilter,
            onChange: (e) => setCqtFilter(e.target.value),
            className: "px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-400",
          },
            h("option", { value: "" }, "Tất cả CQT"),
            danhSachCQT.map((x) => h("option", { key: x, value: x }, x))
          ),
          h("select", {
            value: canBoFilter,
            onChange: (e) => setCanBoFilter(e.target.value),
            className: "px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-400",
          },
            h("option", { value: "" }, "Tất cả cán bộ"),
            danhSachCanBo.map((x) => h("option", { key: x, value: x }, x))
          )
        ),

        filtered.length === 0
          ? h("div", { className: "text-center text-gray-500 py-12" }, "Không tìm thấy doanh nghiệp phù hợp.")
          : h("div", { className: "bg-white rounded-xl shadow-sm overflow-x-auto" },
              h("table", { className: "w-full text-sm" },
                h("thead", { className: "bg-gray-50 text-gray-600 uppercase text-xs" },
                  h("tr", null,
                    [
                      "Mã số thuế", "CQT quản lý", "Tên NNT", "Mã phòng", "Tên phòng",
                      "Mã cán bộ", "Tên cán bộ quản lý", "Người tạo", "Ngày tạo", "Thời gian tạo",
                      "Thay đổi bởi", "Ngày thay đổi", "Thời gian thay đổi",
                    ].map((x) => h("th", { key: x, className: "px-4 py-3 text-left whitespace-nowrap" }, x))
                  )
                ),
                h("tbody", { className: "divide-y divide-gray-100" },
                  filtered.map((d, i) =>
                    h("tr", { key: i, className: "hover:bg-gray-50" },
                      h("td", { className: "px-4 py-3 font-medium text-gray-800 whitespace-nowrap" }, d["Mã số thuế"] || "—"),
                      h("td", { className: "px-4 py-3 text-gray-700 whitespace-nowrap" }, d["CQT quản lý"] || "—"),
                      h("td", { className: "px-4 py-3 font-medium text-gray-800" }, d["Tên NNT"] || "—"),
                      h("td", { className: "px-4 py-3 text-gray-700" }, d["Mã phòng quản lý"] || "—"),
                      h("td", { className: "px-4 py-3 text-gray-700" }, d["Tên phòng"] || "—"),
                      h("td", { className: "px-4 py-3 text-gray-700" }, d["Mã cán bộ"] || "—"),
                      h("td", { className: "px-4 py-3 whitespace-nowrap" },
                        d["Tên cán bộ quản lý"]
                          ? h("button", {
                              onClick: () => setSelectedCanBo(d["Tên cán bộ quản lý"]),
                              className: "text-blue-600 hover:underline font-medium",
                              title: "Xem danh sách doanh nghiệp được quản lý",
                            }, d["Tên cán bộ quản lý"])
                          : "—"
                      ),
                      h("td", { className: "px-4 py-3 text-gray-700" }, getVal(d, "Người tạo", "Người tạo") || "—"),
                      h("td", { className: "px-4 py-3 text-gray-700 whitespace-nowrap" }, formatDate(getVal(d, "Ngày tạo", "Ngày tạo"))),
                      h("td", { className: "px-4 py-3 text-gray-700 whitespace-nowrap" }, d["Thời gian tạo"] || "—"),
                      h("td", { className: "px-4 py-3 text-gray-700" }, getVal(d, "Thay đổi bởi", "Thay đổi bởi") || "—"),
                      h("td", { className: "px-4 py-3 text-gray-700 whitespace-nowrap" }, formatDate(d["Ngày thay đổi"])),
                      h("td", { className: "px-4 py-3 text-gray-700 whitespace-nowrap" }, d["Thời gian thay đổi"] || "—")
                    )
                  )
                )
              )
            ),

        selectedCanBo
          ? h(CanBoDetail, {
              tenCanBo: selectedCanBo,
              data,
              onClose: () => setSelectedCanBo(null),
            })
          : null
      );
    }

    // ====== APP ======
    function App() {
      const [tab, setTab] = useState("nhansu");

      return h("div", { className: "min-h-screen p-6" },
        h("div", { className: "max-w-7xl mx-auto" },
          h("h1", { className: "text-2xl font-bold text-gray-800 mb-4" }, "Quản lý nhân sự & doanh nghiệp"),
          h("div", { className: "flex gap-2 mb-6 border-b border-gray-200" },
            h("button", {
              onClick: () => setTab("nhansu"),
              className: `px-4 py-2 text-sm font-medium border-b-2 ${
                tab === "nhansu" ? "border-blue-600 text-blue-600" : "border-transparent text-gray-500 hover:text-gray-700"
              }`,
            }, "Nhân sự (QLDN2)"),
            h("button", {
              onClick: () => setTab("doanhnghiep"),
              className: `px-4 py-2 text-sm font-medium border-b-2 ${
                tab === "doanhnghiep" ? "border-blue-600 text-blue-600" : "border-transparent text-gray-500 hover:text-gray-700"
              }`,
            }, "Doanh nghiệp (DNphancong)")
          ),
          tab === "nhansu" ? h(NhanSuView) : h(DoanhNghiepView)
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
