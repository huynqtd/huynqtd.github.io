<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Phòng Quản lý Hỗ trợ DN số 2</title>
  
  <!-- Thư viện ngoài -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 50: "#eef4ff", 100: "#d9e6ff", 200: "#bcd3ff", 300: "#8eb5ff", 400: "#598cff", 500: "#3366ff", 600: "#1f4de0", 700: "#1a3fb8", 800: "#1a3894", 900: "#1b3375" } },
          boxShadow: { card: "0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1)", pop: "0 10px 30px rgba(16,24,40,.15)" },
          keyframes: { fadeIn: { "0%": { opacity: 0 }, "100%": { opacity: 1 } }, slideUp: { "0%": { opacity: 0, transform: "translateY(12px)" }, "100%": { opacity: 1, transform: "translateY(0)" } }, bounceIn: { "0%": { transform: "scale(.95)", opacity: 0 }, "60%": { transform: "scale(1.02)" }, "100%": { transform: "scale(1)", opacity: 1 } } },
          animation: { fadeIn: "fadeIn .15s ease-out", slideUp: "slideUp .2s ease-out", bounceIn: "bounceIn .3s ease-out" }
        }
      }
    };
  </script>
  <style>
    /* CSS giữ nguyên như cũ */
    .skeleton { position: relative; overflow: hidden; background: #e5e7eb; }
    .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: shimmer 1.2s infinite; }
    @keyframes shimmer { 100% { transform: translateX(100%); } }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <!-- Nhúng các file JS tự viết -->
  <script src="config.js"></script>
  <script src="hooks.js"></script>
  <script src="components.js"></script>
</body>
</html>
